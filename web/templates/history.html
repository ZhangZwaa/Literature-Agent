<!doctype html><html><head><meta charset="utf-8"><title>Usage History - Literature Agent</title>
<style>:root{font-family:Segoe UI,Arial,sans-serif;color:#202124;background:#f6f7f9}body{margin:0}.wrap{max-width:1050px;margin:24px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:flex-start}.panel{background:#fff;border:1px solid #e2e5e9;border-radius:12px;padding:16px;margin-top:12px}.muted{color:#687078;font-size:13px}button{border:0;border-radius:8px;padding:9px 13px;font-weight:600;cursor:pointer;background:#1769e0;color:#fff}button.secondary{background:#eef2f7;color:#263238}button.danger{background:#b3261e}.month{font-size:18px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.metric{background:#f7f8fa;border-radius:8px;padding:10px}.records{margin-top:12px}.record{display:grid;grid-template-columns:165px 1fr 150px 110px 110px;gap:8px;padding:8px 0;border-top:1px solid #eee;font-size:13px;align-items:center}.empty{text-align:center;padding:50px;color:#687078}</style></head><body><div class="wrap">
<div class="top"><div><h1 style="margin-bottom:6px">Usage History</h1><button class="secondary" onclick="location.href='/dashboard'">Back to Dashboard</button></div><button class="danger" onclick="clearHistory()">Clear History</button></div>
<div class="muted" style="margin-top:12px">Grouped by month. Token units are M (1 M = 1,000,000 tokens). Clearing history does not delete papers, summaries, settings, or embeddings.</div>
<div id="history">Loading...</div></div><script>
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function highlightText(s){ return esc(s); }
function M(n){return (Number(n||0)/1000000).toFixed(3)}
async function loadHistory(){let r=await fetch('/usage/history');let x=await r.json();let el=document.getElementById('history');if(!x.months||!x.months.length){el.innerHTML='<div class="panel empty">No usage history.</div>';return}el.innerHTML=x.months.map(m=>`<div class="panel"><div class="month">${esc(m.month)}</div><div class="summary"><div class="metric"><div class="muted">Calls</div><b>${m.calls}</b></div><div class="metric"><div class="muted">Input</div><b>${M(m.input_tokens)} M</b></div><div class="metric"><div class="muted">Output</div><b>${M(m.output_tokens)} M</b></div><div class="metric"><div class="muted">Total</div><b>${M(m.total_tokens)} M</b></div></div><details class="records"><summary>Show ${m.records.length} records</summary><div class="record muted"><div>Time</div><div>Operation</div><div>Model</div><div>Input</div><div>Output</div></div>${m.records.map(r=>`<div class="record"><div>${esc((r.ts||'').replace('T',' ').slice(0,19))}</div><div>${esc(r.operation)}</div><div>${esc(r.model)}</div><div>${M(r.input_tokens)} M</div><div>${M(r.output_tokens)} M</div></div>`).join('')}</details></div>`).join('')}
async function clearHistory(){if(!confirm('Clear all usage history? This will NOT delete papers, summaries, settings, or embeddings.'))return;let r=await fetch('/usage/clear',{method:'POST'});let x=await r.json();if(!r.ok){alert(x.error||'Failed');return}await loadHistory()}
loadHistory();
</script></body></html>
